name: Deploy Bundles 

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, main]
        description: 'Environment to deploy'
      
      deployment_mode:
        type: choice
        options: [APPEND, RESET]
        description: 'Deployment Mode'
        default: APPEND
      
      # Individual account checkboxes - select one or multiple


      deploy_SAP11:
        type: boolean
        description: 'Deploy to: SAP11'
        default: false

      deploy_techsap:
        type: boolean
        description: 'Deploy to: techsap'
        default: false

      deploy_SAP15:
        type: boolean
        description: 'Deploy to: SAP15'
        default: false


      deploy_vikas0103:
        type: boolean
        description: 'Deploy to: vikas0103'
        default: false

      deploy_sap3:
        type: boolean
        description: 'Deploy to: sap3'
        default: false

      deploy_SAP67:
        type: boolean
        description: 'Deploy to: SAP67'
        default: false

      deploy_taskforce:
        type: boolean
        description: 'Deploy to: taskforce'
        default: false
      # INSERT_CHECKBOX_BEFORE_THIS_LINE
      
      # Deploy to all accounts (overrides individual selections)
      deploy_all:
        type: boolean
        description: 'Deploy to ALL accounts'
        default: false

jobs:
  prepare:
    name: Determine Accounts
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.set-matrix.outputs.accounts }}
      account_count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      
      - name: Determine Accounts to Deploy
        id: set-matrix
        run: |
          # Check if deploying to all accounts
          if [[ "${{ github.event.inputs.deploy_all }}" == "true" ]]; then
            accounts=$(yq eval '.accounts[].name' accounts-config.yml | jq -R -s -c 'split("\n")[:-1]')
            
            # Validate that accounts exist
            count=$(echo "${accounts}" | jq 'length')
            
            # Check if the array is empty or contains only empty strings
            if [[ "${count}" == "0" ]] || [[ "${accounts}" == '[""]' ]]; then
              echo "❌ Error: No accounts found in accounts-config.yml!"
              echo ""
              echo "You selected 'Deploy to ALL accounts' but no accounts are configured."
              echo ""
              echo "Please add at least one account using the 'Add New Account' workflow first."
              exit 1
            fi
            
            echo "accounts=${accounts}" >> $GITHUB_OUTPUT
            echo "count=${count}" >> $GITHUB_OUTPUT
            echo "📋 Deploying to ALL accounts (${count} total)"
            echo "Accounts: ${accounts}"
            exit 0
          fi
          
          # Build list of selected accounts from checkboxes
          selected_accounts=""
          

          if [[ "${{ github.event.inputs.deploy_SAP11 }}" == "true" ]]; then
            selected_accounts="${selected_accounts} SAP11"
          fi

          if [[ "${{ github.event.inputs.deploy_techsap }}" == "true" ]]; then
            selected_accounts="${selected_accounts} techsap"
          fi

          if [[ "${{ github.event.inputs.deploy_SAP15 }}" == "true" ]]; then
            selected_accounts="${selected_accounts} SAP15"
          fi


          if [[ "${{ github.event.inputs.deploy_vikas0103 }}" == "true" ]]; then
            selected_accounts="${selected_accounts} vikas0103"
          fi

          if [[ "${{ github.event.inputs.deploy_sap3 }}" == "true" ]]; then
            selected_accounts="${selected_accounts} sap3"
          fi

          if [[ "${{ github.event.inputs.deploy_SAP67 }}" == "true" ]]; then
            selected_accounts="${selected_accounts} SAP67"
          fi

          if [[ "${{ github.event.inputs.deploy_taskforce }}" == "true" ]]; then
            selected_accounts="${selected_accounts} taskforce"
          fi
          # INSERT_LOGIC_BEFORE_THIS_LINE
          
          # Check if at least one account was selected
          if [[ -z "${selected_accounts}" ]]; then
            echo "❌ Error: No accounts selected!"
            echo ""
            echo "Please select at least one account checkbox or check 'Deploy to ALL accounts'"
            exit 1
          fi
          
          # Convert space-separated list to JSON array
          accounts=$(echo "${selected_accounts}" | xargs -n1 | jq -R -s -c 'split("\n")[:-1]')
          echo "accounts=${accounts}" >> $GITHUB_OUTPUT
          count=$(echo "${accounts}" | jq 'length')
          echo "count=${count}" >> $GITHUB_OUTPUT
          echo "📋 Deploying to ${count} selected account(s)"
          echo "Accounts: ${accounts}"

  deploy:
    name: Deploy to ${{ matrix.account }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account: ${{ fromJson(needs.prepare.outputs.accounts) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      
      - name: Install Dependencies
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      
      - name: Get Account Configuration
        id: config
        run: |
          account_host=$(yq eval ".accounts[] | select(.name == \"${{ matrix.account }}\") | .host" accounts-config.yml)
          warehouse_id=$(yq eval ".accounts[] | select(.name == \"${{ matrix.account }}\") | .warehouse_id" accounts-config.yml)
          
          # Remove trailing slash if present
          account_host="${account_host%/}"
          
          # Validate account exists
          if [[ -z "${account_host}" || "${account_host}" == "null" ]]; then
            echo "❌ Error: Account '${{ matrix.account }}' not found in accounts-config.yml"
            echo ""
            echo "Available accounts:"
            yq eval '.accounts[].name' accounts-config.yml
            echo ""
            echo "Please add this account using the 'Add New Account' workflow first"
            exit 1
          fi
          
          {
            echo "host=${account_host}"
            echo "warehouse_id=${warehouse_id}"
          } >> $GITHUB_OUTPUT
          
          echo "📋 Account: ${{ matrix.account }}"
          echo "📋 Host: ${account_host}"
          echo "📋 Warehouse ID: ${warehouse_id}"
      
      - name: Debug Deployment Mode
        run: |
          echo "======================================"
          echo "🔍 DEBUG: Deployment Mode Input"
          echo "======================================"
          echo "Raw value: '${{ github.event.inputs.deployment_mode }}'"
          echo "Length: ${#value}"
          echo "Is RESET: ${{ github.event.inputs.deployment_mode == 'RESET' }}"
          echo "Is APPEND: ${{ github.event.inputs.deployment_mode == 'APPEND' }}"
          echo "======================================"
      
      - name: Pre-Deploy Cleanup (RESET Mode)
        if: ${{ github.event.inputs.deployment_mode == 'RESET' }}
        env:
          DATABRICKS_HOST: ${{ steps.config.outputs.host }}
        run: |
          echo ""
          echo "======================================"
          echo "🧹 PRE-DEPLOY CLEANUP (RESET MODE)"
          echo "======================================"
          echo "Account: ${{ matrix.account }}"
          echo ""
          
          # Set credentials
          case "${{ matrix.account }}" in
            SAP11) export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_SAP11 }}" ;;
            techsap) export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_TECHSAP }}" ;;
            SAP15) export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_SAP15 }}" ;;
            vikas0103) export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_VIKAS0103 }}" ;;
            sap3) export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_SAP3 }}" ;;
            SAP67) export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_SAP67 }}" ;;
            taskforce) export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_taskforce }}" ;;
            # INSERT_CASE_BEFORE_THIS_LINE
            *) echo "❌ Unknown account"; exit 1 ;;
          esac
          
          # ============================================================================
          # SAFE CLEANUP - Only deletes what the token has permission for
          # ============================================================================
          
          # 1. DELETE JOBS (most important - prevents duplicates)
          echo "🗑️  Step 1: Deleting jobs..."
          job_ids=$(databricks jobs list --output JSON 2>/dev/null | jq -r '.[].job_id' 2>/dev/null || echo "")
          
          if [ -z "$job_ids" ]; then
            echo "   ℹ️  No jobs found or no permission to list jobs"
          else
            job_count=$(echo "$job_ids" | wc -l)
            echo "   Found $job_count jobs - deleting..."
            for job_id in $job_ids; do
              databricks jobs delete $job_id 2>/dev/null && echo "   ✓ Deleted job $job_id" || echo "   ⚠️  Could not delete job $job_id (may lack permission)"
            done
          fi
          
          # 2. DELETE DASHBOARDS
          echo ""
          echo "🗑️  Step 2: Deleting dashboards..."
          dashboard_ids=$(databricks dashboards list --output JSON 2>/dev/null | jq -r '.[].dashboard_id' 2>/dev/null || echo "")
          
          if [ -z "$dashboard_ids" ]; then
            echo "   ℹ️  No dashboards found or no permission to list dashboards"
          else
            dashboard_count=$(echo "$dashboard_ids" | wc -l)
            echo "   Found $dashboard_count dashboards - deleting..."
            for dashboard_id in $dashboard_ids; do
              databricks dashboards delete $dashboard_id 2>/dev/null && echo "   ✓ Deleted dashboard $dashboard_id" || echo "   ⚠️  Could not delete dashboard $dashboard_id"
            done
          fi
          
          # 3. CLEAN BUNDLE ARTIFACTS (workspace folders)
          echo ""
          echo "🗑️  Step 3: Cleaning bundle artifacts..."
          
          # Old locations (inside Git folder - legacy)
          OLD_ARTIFACTS=(
            "/Shared/${{ github.event.inputs.environment }}/SkillAIPath/artifacts"
            "/Shared/${{ github.event.inputs.environment }}/SkillAIPath/files"
            "/Shared/${{ github.event.inputs.environment }}/SkillAIPath/resources"
            "/Shared/${{ github.event.inputs.environment }}/SkillAIPath/state"
            "/Shared/${{ github.event.inputs.environment }}/SkillAIPath/.bundle"
          )
          
          for path in "${OLD_ARTIFACTS[@]}"; do
            databricks workspace rm -r "$path" 2>/dev/null && echo "   ✓ Removed $path" || echo "   ℹ️  $path not found (OK)"
          done
          
          # New location (outside Git folder)
          databricks workspace rm -r "/Workspace/.bundle_metadata/${{ github.event.inputs.environment }}/SkillAIPath" 2>/dev/null && echo "   ✓ Removed bundle artifacts" || echo "   ℹ️  Bundle artifacts not found (OK)"
          

          # Clean source code deployment
          databricks workspace rm -r "/Workspace/Shared/${{ github.event.inputs.environment }}/SkillAIPath" 2>/dev/null && echo "   ✓ Removed source code" || echo "   ℹ️  Source code not found (OK)"
          # 4. SKIP OPERATIONS THAT REQUIRE ELEVATED PERMISSIONS
          echo ""
          echo "⏭️  Skipped (require elevated permissions):"
          echo "   • Pipelines (require pipeline admin)"
          echo "   • Catalogs (require metastore admin)"
          echo "   • Volumes (deleted with catalog)"
          echo ""
          echo "   ℹ️  If you need to clean these, run cleanup manually in UI"
          echo "      or grant service principal elevated permissions"
          
          echo ""
          echo "✅ Pre-deploy cleanup complete!"
          echo "======================================"
      
      - name: Deploy Bundle
        env:
          DATABRICKS_HOST: ${{ steps.config.outputs.host }}
        run: |
          echo ""
          echo "======================================"
          echo "🚀 Deploying Bundle to: ${{ matrix.account }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Mode: ${{ github.event.inputs.deployment_mode }}"
          echo "======================================"
          
          # Set credentials based on account name (explicit case statements only)
          case "${{ matrix.account }}" in
            SAP11)
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_SAP11 }}"
              ;;
            techsap)
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_TECHSAP }}"
              ;;
            SAP15)
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_SAP15 }}"
              ;;
            vikas0103)
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_VIKAS0103 }}"
              ;;
            sap3)
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_SAP3 }}"
              ;;
            SAP67)
              export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_SAP67 }}"
              ;;
            taskforce) export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN_taskforce }}" ;;
            # INSERT_CASE_BEFORE_THIS_LINE
            *)
              echo "❌ Unknown account: ${{ matrix.account }}"
              echo "💡 This account was not found in the case statement"
              echo "💡 The 'Add New Account' workflow should have added it automatically"
              echo "💡 Make sure the GitHub secret exists: DATABRICKS_TOKEN_${{ matrix.account }}"
              exit 1
              ;;
          esac
          
          if [ -z "${DATABRICKS_TOKEN}" ]; then
            echo "❌ Missing secret for account: ${{ matrix.account }}"
            exit 1
          fi
          
          echo "Account: ${{ matrix.account }}"
          echo "Host: ${DATABRICKS_HOST}"
          echo "Warehouse ID: ${{ steps.config.outputs.warehouse_id }}"
          echo "Dashboard File: bi_report_${{ github.event.inputs.environment }}.lvdash.json"
          echo ""
          
          # Deploy bundle
          echo "📦 Deploying bundle..."
          databricks bundle deploy \
            --target ${{ github.event.inputs.environment }} \
            --var="environment=${{ github.event.inputs.environment }}" \
            --var="catalog=sap_${{ github.event.inputs.environment }}" \
            --var="warehouse_id=${{ steps.config.outputs.warehouse_id }}" \
            --auto-approve
          
          echo "✅ ${{ matrix.account }} bundle deployment complete!"

  summary:
    name: Deployment Summary
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Results
        run: |
          echo ""
          echo "======================================"
          echo "📊 DEPLOYMENT SUMMARY"
          echo "======================================"
          echo "Total Accounts: ${{ needs.prepare.outputs.account_count }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo ""
          
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ All bundle deployments completed successfully!"
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "❌ Some deployments failed. Check the logs above."
            exit 1
          else
            echo "⚠️  Deployment status: ${{ needs.deploy.result }}"
          fi
          echo "======================================"
