name: Onboard Account

on:
  workflow_dispatch:
    inputs:
      account_name:
        description: 'Account Name (e.g., main, staging, dev)'
        required: true
        type: string
      databricks_host:
        description: 'Databricks Workspace URL'
        required: true
        type: string
      warehouse_id:
        description: 'SQL Warehouse ID'
        required: true
        type: string
      databricks_token:
        description: 'Databricks PAT Token (will be stored as secret)'
        required: true
        type: string
      skip_validation:
        description: 'Skip connection validation'
        required: false
        type: boolean
        default: false

jobs:
  provision-account:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pyyaml requests
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate Inputs
        run: |
          echo "Validating inputs..."
          if [[ ! "${{ github.event.inputs.account_name }}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: Invalid account name format"
            exit 1
          fi
          echo "Validation passed"

      - name: Update accounts-config.yml
        run: |
          echo "Updating accounts-config.yml..."
          
          # Sanitize URL - remove trailing slash
          DATABRICKS_HOST="${{ github.event.inputs.databricks_host }}"
          DATABRICKS_HOST="${DATABRICKS_HOST%/}"
          
          # Check if account already exists
          existing_account=$(yq eval ".accounts[] | select(.name == \"${{ github.event.inputs.account_name }}\") | .name" accounts-config.yml)
          
          if [ ! -z "$existing_account" ]; then
            echo "⚠️  Account '${{ github.event.inputs.account_name }}' already exists in accounts-config.yml"
            echo "Updating existing entry..."
            
            # Update existing entry
            yq eval "(.accounts[] | select(.name == \"${{ github.event.inputs.account_name }}\") | .host) = \"${DATABRICKS_HOST}\"" -i accounts-config.yml
            yq eval "(.accounts[] | select(.name == \"${{ github.event.inputs.account_name }}\") | .warehouse_id) = \"${{ github.event.inputs.warehouse_id }}\"" -i accounts-config.yml
            echo "✅ Updated existing account"
          else
            echo "Adding new account..."
            
            # Add new entry
            yq eval ".accounts += [{
              \"name\": \"${{ github.event.inputs.account_name }}\",
              \"host\": \"${DATABRICKS_HOST}\",
              \"warehouse_id\": \"${{ github.event.inputs.warehouse_id }}\"
            }]" -i accounts-config.yml
            echo "✅ Added new account"
          fi
          
          echo "Done"

      # NOTE: We do NOT update databricks.yml here
      # Only dev and main targets exist in databricks.yml
      # Accounts are only used for workspace credentials, not as targets

      - name: Create GitHub Secret
        run: |
          echo "Creating GitHub secret..."
          SECRET_NAME="DATABRICKS_TOKEN_${{ github.event.inputs.account_name }}"
          SECRET_NAME_UPPER="${SECRET_NAME^^}"
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list
          sudo apt update && sudo apt install -y gh
          echo -n "${{ github.event.inputs.databricks_token }}" | gh secret set "${SECRET_NAME_UPPER}" --repo ${{ github.repository }}
          echo "Secret created: ${SECRET_NAME_UPPER}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}


      - name: Update Workflow Files
        run: |
          ACCOUNT_NAME="${{ github.event.inputs.account_name }}"
          SECRET_NAME_UPPER=$(echo "DATABRICKS_TOKEN_${ACCOUNT_NAME}" | tr '[:lower:]' '[:upper:]')
          DOLLAR='$'
          
          for workflow_file in .github/workflows/deploy-bundles.yml; do
            if [ ! -f "$workflow_file" ]; then
              echo "File not found: $workflow_file"
              continue
            fi
            
            echo "Processing $workflow_file..."
            
            # Check if checkbox already exists
            if grep -q "deploy_${ACCOUNT_NAME}:" "$workflow_file"; then
              echo "Account ${ACCOUNT_NAME} already exists in $workflow_file"
              continue
            fi
            
            # 1. Add checkbox input - search for INSERT_CHECKBOX_BEFORE_THIS_LINE marker
            comment_line=$(grep -n "# INSERT_CHECKBOX_BEFORE_THIS_LINE" "$workflow_file" | head -1 | cut -d: -f1)
            if [ -z "$comment_line" ]; then
              echo "Could not find checkbox insertion marker in $workflow_file"
              continue
            fi
            
            insert_line=$((comment_line - 1))
            head -n $insert_line "$workflow_file" > "${workflow_file}.tmp"
            echo "" >> "${workflow_file}.tmp"
            echo "      deploy_${ACCOUNT_NAME}:" >> "${workflow_file}.tmp"
            echo "        type: boolean" >> "${workflow_file}.tmp"
            echo "        description: 'Deploy to: ${ACCOUNT_NAME}'" >> "${workflow_file}.tmp"
            echo "        default: false" >> "${workflow_file}.tmp"
            tail -n +$((insert_line + 1)) "$workflow_file" >> "${workflow_file}.tmp"
            mv "${workflow_file}.tmp" "$workflow_file"
            echo "✅ Added checkbox for ${ACCOUNT_NAME}"
            
            # 2. Add checkbox logic in prepare job - search for INSERT_LOGIC_BEFORE_THIS_LINE marker
            check_line=$(grep -n "# INSERT_LOGIC_BEFORE_THIS_LINE" "$workflow_file" | head -1 | cut -d: -f1)
            if [ ! -z "$check_line" ]; then
              insert_line=$((check_line - 1))
              head -n $insert_line "$workflow_file" > "${workflow_file}.tmp"
              echo "" >> "${workflow_file}.tmp"
              echo "          if [[ \"${DOLLAR}{{ github.event.inputs.deploy_${ACCOUNT_NAME} }}\" == \"true\" ]]; then" >> "${workflow_file}.tmp"
              echo "            selected_accounts=\"\${selected_accounts} ${ACCOUNT_NAME}\"" >> "${workflow_file}.tmp"
              echo "          fi" >> "${workflow_file}.tmp"
              tail -n +$((insert_line + 1)) "$workflow_file" >> "${workflow_file}.tmp"
              mv "${workflow_file}.tmp" "$workflow_file"
              echo "✅ Added checkbox logic for ${ACCOUNT_NAME}"
            fi
            
            # 3. Add case statement in ALL locations - search for INSERT_CASE_BEFORE_THIS_LINE marker
            {
              echo 'import sys'
              echo 'workflow_file = sys.argv[1]'
              echo 'account_name = sys.argv[2]'
              echo 'secret_name_upper = sys.argv[3]'
              echo 'dollar = sys.argv[4]'
              echo ''
              echo 'with open(workflow_file, "r") as f:'
              echo '    content = f.read()'
              echo ''
              echo 'marker = "# INSERT_CASE_BEFORE_THIS_LINE"'
              echo 'case_count = content.count(marker)'
              echo ''
              echo 'if case_count == 0:'
              echo '    print(f"Could not find case insertion marker in {workflow_file}")'
              echo 'else:'
              echo '    case_entry = f"""            {account_name})'
              echo '                      export DATABRICKS_TOKEN="{dollar}{{{{ secrets.{secret_name_upper} }}}}"'
              echo '                      ;;'
              echo '                    {marker}"""'
              echo '    content = content.replace(f"            {marker}", case_entry)'
              echo '    with open(workflow_file, "w") as f:'
              echo '        f.write(content)'
              echo '    print(f"✅ Added case statement for {account_name} to {case_count} location(s)")'
            } > /tmp/update_cases.py
            
            python3 /tmp/update_cases.py "$workflow_file" "${ACCOUNT_NAME}" "${SECRET_NAME_UPPER}" "${DOLLAR}"
            echo "✅ Updated $workflow_file"
          done
          
          echo ""
          echo "✅ All workflow files updated successfully!"
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add accounts-config.yml .github/workflows/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add account: ${{ github.event.inputs.account_name }}"
            git push
            echo "Changes committed"
          fi

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "✅ ACCOUNT ADDED SUCCESSFULLY"
          echo "=========================================="
          echo "Account: ${{ github.event.inputs.account_name }}"
          echo "Host: ${{ github.event.inputs.databricks_host }}"
          echo ""
          echo "Files updated:"
          echo "  ✅ accounts-config.yml"
          echo "  ✅ databricks.yml"
          echo "  ✅ .github/workflows/deploy-bundles.yml"
          echo ""
          echo "GitHub Secret created:"
          echo "  ✅ DATABRICKS_TOKEN_${{ github.event.inputs.account_name }}"
          echo ""
          echo "Next steps:"
          echo "  1. Go to Actions > Deploy Folders or Deploy Bundles"
          echo "  2. Select 'deploy_${{ github.event.inputs.account_name }}' checkbox"
          echo "  3. Choose environment and run!"
          echo "=========================================="
