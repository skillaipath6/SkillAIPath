bundle:
  name: skillai-platform-workflows
  git:
    origin_url: https://github.com/SkillAIPath11/SkillAIPath
sync:
  include:
  - 0_Core_Analytics/**
  - 1_Canvas/**
  - 2_Data_Production/**
  exclude:
  - .git/**
  - .github/**
  - '*.md'
  - .gitignore
variables:
  warehouse_id:
    description: SQL Warehouse ID for dashboards
    default: 68ffee63b84e0f96
  environment:
    description: Environment (dev or main)
  catalog:
    description: Unity Catalog name
targets:
  dev:
    mode: production
    workspace:
      root_path: /Workspace/.bundle_metadata/dev/SkillAIPath
      file_path: /Workspace/Shared/dev/SkillAIPath
    variables:
      environment: dev
      catalog: sap_dev
  main:
    mode: production
    workspace:
      root_path: /Workspace/.bundle_metadata/main/SkillAIPath
      file_path: /Workspace/Shared/main/SkillAIPath
    variables:
      environment: main
      catalog: sap_main
resources:
  jobs:
    02_ondemand_edufin_core_analytics:
      name: 02_OnDemand_EduFin_Core_Analytics ${var.environment}
      email_notifications: {}
      webhook_notifications: {}
      timeout_seconds: 0
      max_concurrent_runs: 3
      tasks:
      - task_key: EduFin_Data_Setup
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/0_Core_Analytics/02_EduFin/0_Data_Setup
          source: WORKSPACE
        email_notifications: {}
      - task_key: EduFin_Portfolio_Health
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/0_Core_Analytics/02_EduFin/1_Portfolio Health
          source: WORKSPACE
        depends_on:
        - task_key: EduFin_Data_Setup
        email_notifications: {}
      - task_key: EduFin_Customer_Risk
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/0_Core_Analytics/02_EduFin/2_Customer Risk
          source: WORKSPACE
        depends_on:
        - task_key: EduFin_Data_Setup
        email_notifications: {}
      - task_key: EduFin_Time_Analysis
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/0_Core_Analytics/02_EduFin/3_Time Analysis
          source: WORKSPACE
        depends_on:
        - task_key: EduFin_Data_Setup
        email_notifications: {}
      - task_key: EduFin_Cost_Tracking
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/0_Core_Analytics/02_EduFin/4_Cost_Tracking
          source: WORKSPACE
        depends_on:
        - task_key: EduFin_Data_Setup
        email_notifications: {}
      tags:
        Analytics: ''
        Education: ''
        Finance: ''
        OnDemand: ''
      format: MULTI_TASK
