bundle:
  name: skillaipath
sync:
  include:
  - 0_Core_Analytics/**
  - 1_Canvas/**
  - 2_Data_Production/**
  - 3_AI_Platform/**
  - 4_Business_Intelligence/**
  - 5_Lead_Engineer/**
  exclude:
  - .git/**
  - .github/**
  - '*.md'
  - .gitignore
  - accounts-config.yml
  - databricks-*.yml
variables:
  warehouse_id:
    description: SQL Warehouse ID for dashboards
    default: 68ffee63b84e0f96
  environment:
    description: Environment (dev or main)
  catalog:
    description: Unity Catalog name
  batch_days:
    description: Number of days for batch data generation (Job 01)
    default: 7
targets:
  dev:
    mode: production
    workspace:
      root_path: /Workspace/.bundle_metadata/dev/SkillAIPath
      file_path: /Workspace/Shared/dev/SkillAIPath
    variables:
      environment: dev
      catalog: sap_dev
      batch_days: 7
  main:
    mode: production
    workspace:
      root_path: /Workspace/.bundle_metadata/main/SkillAIPath
      file_path: /Workspace/Shared/main/SkillAIPath
    variables:
      environment: main
      catalog: sap_main
      batch_days: 7
resources:
  jobs:
    00_master_start_skillai:
      name: 00_Master_Start_SkillAI ${var.environment}
      webhook_notifications: {}
      timeout_seconds: 0
      max_concurrent_runs: 3
      queue:
        enabled: true
      tasks:
      - task_key: 01_Data_Ingestion
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/1_Canvas/1_Setup/2_DataGenerator
          source: WORKSPACE
          base_parameters:
            mode: batch
            run_source: workflow
            BATCH_DAYS: ${var.batch_days}
            environment: ${var.environment}
            write_mode: append
        timeout_seconds: 0
      - task_key: 02_DBT_Full_Transform
        depends_on:
        - task_key: 01_Data_Ingestion
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/03_Dbt/StartHere_DBT
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 02_Bronze_Stream_Generator
        depends_on:
        - task_key: 02_DBT_Full_Transform
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/02_Medallion_Architecture/03_Streaming_Cdc/00_bronze_to_stream_generator
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 03_DLT_Setup_And_Run
        depends_on:
        - task_key: 02_DBT_Full_Transform
        - task_key: 02_Bronze_Stream_Generator
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/02_Medallion_Architecture/03_Streaming_Cdc/11_setup_silver_dlt_pipeline
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 04_Lakebase_Setup
        depends_on:
        - task_key: 02_DBT_Full_Transform
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/06_Lakebase_LTAP/01_oltp_database_setup
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 06_LTAP_Sync
        depends_on:
        - task_key: 02_DBT_Full_Transform
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/06_Lakebase_LTAP/03_oltp_to_olap_sync
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 07_Retail_Ops_DB_Setup
        depends_on:
        - task_key: 02_DBT_Full_Transform
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/06_Lakebase_LTAP/02_retail_ops_database_setup
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 08_Knowledge_Retrieval
        depends_on:
        - task_key: 02_DBT_Full_Transform
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/3_AI_Platform/2_Rag_Pipeline/customer_360
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 09_Ecommerce_Intelligence
        depends_on:
        - task_key: 08_Knowledge_Retrieval
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/3_AI_Platform/2_Rag_Pipeline/ecommerce_intelligence
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 10_Customer_360
        depends_on:
        - task_key: 09_Ecommerce_Intelligence
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/3_AI_Platform/2_Rag_Pipeline/customer_360
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 11_Auto_Documentation
        depends_on:
        - task_key: 10_Customer_360
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/3_AI_Platform/3_AI_Agents/02_Knowledge_Hub/AutoDocumentation
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 12_Churn_Prediction
        depends_on:
        - task_key: 08_Knowledge_Retrieval
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/3_AI_Platform/1_MLOps/01_Churn_Prediction_Training
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 13_Product_Recommendation
        depends_on:
        - task_key: 08_Knowledge_Retrieval
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/3_AI_Platform/1_MLOps/02_Product_Recommendation_Training
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 14_Demand_Forecasting
        depends_on:
        - task_key: 08_Knowledge_Retrieval
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/3_AI_Platform/1_MLOps/03_Demand_Forecasting_Training
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 15_Next_Purchase_Prediction
        depends_on:
        - task_key: 08_Knowledge_Retrieval
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/3_AI_Platform/1_MLOps/04_Next_Purchase_Prediction_Training
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 16_Deploy_BizApps
        depends_on:
        - task_key: 14_Demand_Forecasting
        - task_key: 13_Product_Recommendation
        - task_key: 15_Next_Purchase_Prediction
        - task_key: 07_Retail_Ops_DB_Setup
        - task_key: 12_Churn_Prediction
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/4_Business_Intelligence/3_Live_Apps/04_deploy_apps_job
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      - task_key: 17_Create_Genie_Spaces
        depends_on:
        - task_key: 02_DBT_Full_Transform
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/4_Business_Intelligence/2_BI_Production/1_setup/02_genie_space_creation
          source: WORKSPACE
          base_parameters:
            environment: ${var.environment}
        timeout_seconds: 0
      tags:
        Full-Pipeline: ''
        Master: ''
        Orchestration: ''
        Production: ''
      format: MULTI_TASK
    01_ondemand_devops:
      name: 01_OnDemand_DevOps ${var.environment}
      webhook_notifications: {}
      timeout_seconds: 0
      max_concurrent_runs: 3
      parameters:
      - name: github_token
        default: ''
      tasks:
      - task_key: GitHub_Auto_Setup
        notebook_task:
          notebook_path: /Shared/${var.environment}/SkillAIPath/1_Canvas/0_DevOps/Production/GitHub_Auto_Setup
          source: WORKSPACE
          base_parameters:
            github_token: '{{job.parameters.github_token}}'
        timeout_seconds: 0
      tags:
        OnDemand: 'true'
        DevOps: 'true'
        CI/CD: 'true'
        GitHub: 'true'
        Setup: 'true'
      format: MULTI_TASK
    02_ondemand_edufin_core_analytics:
