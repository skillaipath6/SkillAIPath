bundle:
  name: skillai-platform-workflows
  git:
    origin_url: https://github.com/SkillAIPath11/SkillAIPath

# Sync configuration - deploys actual source files to workspace
sync:
  include:
    - "0_Core_Analytics/**"
    - "1_Canvas/**"
    - "2_Data_Production/**"
    - "3_AI_Platform/**"
    - "4_Business_Intelligence/**"
    - "5_Growth_Accelerator/**"
  exclude:
    - ".git/**"
    - ".github/**"
    - "*.md"
    - ".gitignore"

# Note: workspace.host is intentionally NOT set here
# It is provided dynamically via DATABRICKS_HOST environment variable
# This allows multi-account deployments to different workspaces

variables:
  warehouse_id:
    description: SQL Warehouse ID for dashboards
    default: 68ffee63b84e0f96
  environment:
    description: Environment (dev or main)
  catalog:
    description: Unity Catalog name
targets:
  dev:
    mode: production
    workspace:
      root_path: /Workspace/.bundle_metadata/dev/SkillAIPath
      file_path: /Workspace/Shared/dev/SkillAIPath
    variables:
      environment: dev
      catalog: sap_dev
  main:
    mode: production
    workspace:
      root_path: /Workspace/.bundle_metadata/main/SkillAIPath
      file_path: /Workspace/Shared/main/SkillAIPath
    variables:
      environment: main
      catalog: sap_main

resources:
  # Catalog, schema, and pipeline creation all handled by 01_Full_Load_Pipeline job
  # Bundle only manages jobs and dashboards for infrastructure-as-code
  
  jobs:
    00_master_start_skillai:
      name: 00_Master_Start_SkillAI ${var.environment}
      email_notifications: {}
      webhook_notifications: {}
      timeout_seconds: 0
      max_concurrent_runs: 3
      queue:
        enabled: true
      tasks:
        - task_key: 01_Full_Load_Pipeline
          notebook_task:
            notebook_path: /Shared/${var.environment}/SkillAIPath/1_Canvas/2_Orchestration/Data_Platform/14_StartDBT_Full
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
          timeout_seconds: 0
          email_notifications: {}
        - task_key: 02_Bronze_Stream_Generator
          depends_on:
            - task_key: 01_Full_Load_Pipeline
          notebook_task:
            notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/02_Medallion_Architecture/03_Streaming_Cdc/00_bronze_to_stream_generator
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
          timeout_seconds: 0
          email_notifications: {}
        - task_key: 03_DLT_Setup_And_Run
          depends_on:
            - task_key: 01_Full_Load_Pipeline
            - task_key: 02_Bronze_Stream_Generator
          notebook_task:
            notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/02_Medallion_Architecture/03_Streaming_Cdc/11_setup_silver_dlt_pipeline
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
          timeout_seconds: 0
          email_notifications: {}
        - task_key: 04_Lakebase_Setup
          depends_on:
            - task_key: 01_Full_Load_Pipeline
          notebook_task:
            notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/06_Lakebase_LTAP/01_oltp_database_setup
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
          timeout_seconds: 0
          email_notifications: {}
        - task_key: 06_LTAP_Sync
          depends_on:
            - task_key: 01_Full_Load_Pipeline
          notebook_task:
            notebook_path: /Shared/${var.environment}/SkillAIPath/2_Data_Production/06_Lakebase_LTAP/03_oltp_to_olap_sync
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
          timeout_seconds: 0
          email_notifications: {}
        - task_key: 07_Retail_Ops_DB_Setup
          depends_on:
