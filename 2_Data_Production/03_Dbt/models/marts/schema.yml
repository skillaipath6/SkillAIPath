version: 2

models:
  - name: mart_customer_360
    description: "Complete customer profile with lifetime metrics and segmentation"
    columns:
      - name: CustomerKey
        description: "Surrogate key for customer"
        tests:
          - unique
          - not_null
      - name: TotalSpend
        description: "Customer lifetime value"
        tests:
          - not_null
      - name: CustomerSegment
        description: "Customer classification (New/Returning/VIP)"
        tests:
          - accepted_values:
              values: ['New Customer', 'Returning Customer', 'VIP Customer']

  - name: mart_product_performance
    description: "Product sales and revenue analysis with performance categorization"
    columns:
      - name: ProductSK
        description: "Product surrogate key"
        tests:
          - unique
          - not_null
      - name: TotalRevenue
        description: "Total revenue generated by product"
      - name: PerformanceCategory
        description: "Product performance classification"
        tests:
          - accepted_values:
              values: ['Best Seller', 'Popular', 'Moderate', 'Slow Mover']

  - name: mart_inventory_health
    description: "Warehouse stock levels and turnover metrics"
    columns:
      - name: ProductSK
        description: "Product surrogate key"
        tests:
          - not_null
      - name: WarehouseSK
        description: "Warehouse surrogate key"
        tests:
          - not_null
      - name: HealthStatus
        description: "Inventory health status"
        tests:
          - accepted_values:
              values: ['Understock', 'Overstock', 'Healthy']

  - name: mart_rfm_analysis
    description: "RFM (Recency, Frequency, Monetary) customer segmentation analysis"
    columns:
      - name: CustomerSK
        description: "Customer surrogate key"
        tests:
          - unique
          - not_null
      - name: CustomerName
        description: "Customer name"
      - name: Recency
        description: "Days since last purchase"
        tests:
          - not_null
      - name: Frequency
        description: "Total number of orders"
        tests:
          - not_null
      - name: Monetary_Lakhs
        description: "Total monetary value in lakhs"
        tests:
          - not_null
      - name: R_Score
        description: "Recency score (1-5, 5 = most recent)"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: F_Score
        description: "Frequency score (1-5, 5 = most frequent)"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: M_Score
        description: "Monetary score (1-5, 5 = highest value)"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: RFM_Score
        description: "Combined RFM score (e.g., 555 = Champions)"
      - name: Segment
        description: "Customer segment based on RFM scores"
        tests:
          - not_null
          - accepted_values:
              values: ['Champions', 'Loyal Customers', 'Recent Customers', 'At Risk', 
                       'Cant Lose Them', 'Promising', 'Potential Loyalist', 'New Customers',
                       'Needs Attention', 'About to Sleep', 'Hibernating', 'Lost Customers', 'Others']
