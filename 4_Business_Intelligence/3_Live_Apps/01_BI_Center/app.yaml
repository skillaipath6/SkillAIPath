command:
  - "python"
  - "app.py"
# Apps V2 automatically provides DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
# Do NOT set them explicitly - they cause auth conflicts
env:
  - name: WAREHOUSE_ID
    value: "02803523ef6dcdec"
  - name: CATALOG
    value: "sap_dev"  # UC catalog for all BI Center queries (app.py reads this)
resources:
  cpu: "2"
  memory: "4Gi"
