name: Autograder Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Get diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
      
      - name: Run checks
        id: check
        run: |
          ISSUES=""
          if ! grep -q "%run\|Config\." diff.txt; then
            ISSUES="$ISSUES- Missing Config pattern\n"
          fi
          if ! echo "${{ github.event.pull_request.title }}" | grep -qE "[0-9]{2}_[a-z_]+\.py"; then
            ISSUES="$ISSUES- Notebook naming: Use 01_name.py\n"
          fi
          if grep -qi "SELECT.*\*" diff.txt && ! grep -qi "LIMIT" diff.txt; then
            ISSUES="$ISSUES- SELECT * without LIMIT\n"
          fi
          if grep -q "def " diff.txt && ! grep -q "try:" diff.txt; then
            ISSUES="$ISSUES- Add error handling\n"
          fi
          
          if [ -z "$ISSUES" ]; then
            echo "msg=Autograder Approved" >> $GITHUB_OUTPUT
            echo "event=APPROVE" >> $GITHUB_OUTPUT
          else
            echo "msg=Changes Requested:\n\n$ISSUES" >> $GITHUB_OUTPUT
            echo "event=REQUEST_CHANGES" >> $GITHUB_OUTPUT
          fi
      
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: "${{ steps.check.outputs.msg }}",
              event: "${{ steps.check.outputs.event }}"
            });
